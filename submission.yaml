submission:
  title: "Nexora — Operational Risk & Supply Intelligence Platform"

  problem_statement: >
    Semiconductor fabs face severe revenue loss and delivery slippage when equipment WIP queues overload and single-source chemical/material suppliers suffer disruptions. Operations and procurement teams struggle with fragmented data, lack of explainable queue bottleneck diagnostics, and inability to simulate multi-tier supply shock impacts before committing to costly mitigation actions.

  solution_summary: >
    Nexora is an explainable operational intelligence platform that pinpoints fab tool bottlenecks from real-time WIP queue ratios, predicts downstream delivery delays using a verified RandomForestRegressor ML model, evaluates single-point-of-failure suppliers and geopolitical concentration risks, simulates operational disruptions via an interactive 4-scenario What-If engine, and synthesizes prioritized, condition-driven mitigation protocols.

  key_features:
    - "Real-time Fab Bottleneck Intelligence with transparent WIP queue pressure formulas and multi-stage downstream starvation tracking"
    - "Explainable 5-Factor Supplier Risk Scoring (0–100) with automatic Single-Point-of-Failure (SPoF) and geopolitical concentration detection"
    - "Interpretable Machine Learning Delivery Delay Prediction (RandomForestRegressor, R² = 0.954) with feature importance attribution and physics fallback"
    - "Interactive 4-Scenario What-If Disruption Simulator computing side-by-side Before vs After metrics diffs and SLA exposure"
    - "Grounded Operational Decision Assistant delivering explainable natural-language reasoning with supporting facts strictly from verified telemetry"

  tech_stack:
    languages:
      - "Python"
      - "JavaScript"
      - "SQL"
      - "HTML/CSS"
    frameworks:
      - "Flask"
      - "React"
      - "Vite"
      - "scikit-learn"
      - "Pandas"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "SQLite"
    other:
      - "Pytest"
      - "Joblib"
      - "Lucide Icons"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    Our end-to-end explainability architecture: every risk score (bottleneck utilization and 5-factor supplier score) and ML delivery prediction explicitly breaks down its contributing drivers and physics formulas with zero black-box obscurity. Furthermore, the What-If Disruption Simulator allows line managers to test multi-day supplier outages or tool failures and receive immediate Before vs After financial exposure and prescriptive mitigation protocols.

  known_limitations: >
    Demonstration fab equipment, wafer lot queues, and supplier dependency percentages are generated using a reproducible deterministic synthetic generator (Seed: 42) rather than proprietary fab telemetry. Geopolitical risk indicators use a structured baseline factor model rather than a live external geopolitical API feed.

